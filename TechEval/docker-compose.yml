services:
  postgres:
    image: postgres:16-alpine
    container_name: techeval_postgres
    environment:
      POSTGRES_DB: techeval
      POSTGRES_USER: techeval
      POSTGRES_PASSWORD: techeval_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U techeval"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: techeval_redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- POST-MVP: Descomentar cuando se migre el almacenamiento a MinIO ---
