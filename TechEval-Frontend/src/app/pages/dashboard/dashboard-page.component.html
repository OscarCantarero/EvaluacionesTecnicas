<section class="ui-card">
  <div class="ui-card-body">
  <p class="ui-kicker">Plataforma de Evaluaciones Técnicas</p>
  <h2 class="ui-section-title flex items-center gap-2">
    <span [innerHTML]="icons.home | safeHtml"></span> Vista operacional para evaluadores y candidatos
  </h2>
  <p class="ui-lead">
    Consola central para operar evaluaciones técnicas, sesiones en vivo y resultados de candidatos.
  </p>
  </div>
</section>

<section class="stats-grid">
  @for (card of statCards(); track card.label) {
    <article class="card bg-base-100 border border-base-300">
      <div class="card-body p-5">
        <div class="flex items-center gap-2 text-sm text-base-content/70">
          <span [innerHTML]="card.icon | safeHtml" class="opacity-60"></span>
          {{ card.label }}
        </div>
        <h3 class="text-3xl font-semibold mt-1">{{ card.value }}</h3>
        <small class="text-primary font-medium">{{ card.note }}</small>
      </div>
    </article>
  }
</section>
